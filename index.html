<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Port Operation Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="c-title">CEMENT LOADING</div>
  
  <div class="board-main" id="berthGrid"></div>
  
  <div class="alpha-title">Berth A</div>
  <div class="board-main" id="alphaGrid"></div>

  <div class="lower-dashboard">
    <div class="panel">
      <div id="truckingTable"></div>
    </div>
    <div class="panel col-mid">
      <div id="vesselLoadingTable"></div>
    </div>
    <div class="panel col-right">
      <div id="dailyProdTable"></div>
      <div id="truckingStockpileTable"></div>
    </div>
  </div>

  <div class="footer-dashboard">
    <div class="panel footer-panel">
      <div class="f-row"><span>Supervisor</span><b id="supervisor">--</b></div>
      <div class="f-row"><span>Checker</span><b id="checker">--</b></div>
      <div class="f-row"><span>PMC</span><b id="pmc">--</b></div>
    </div>
    <div class="panel footer-panel">
      <div class="f-row"><span>Crane</span><b id="cranes">--</b></div>
      <div class="f-row"><span>Forklift</span><b id="forklifts">--</b></div>
    </div>
    <div class="panel footer-panel">
      <div class="f-row"><span># of stevedor Per Shift</span><b id="stevedores">--</b></div>
    </div>
    <div class="panel footer-panel clock-panel">
      <div id="phDate">--</div>
      <div id="phTime">--:--:--</div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
