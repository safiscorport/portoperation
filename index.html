<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Port Operation Flight-Board</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="live-dot"></span><span class="title">PORT OPERATION FLIGHT-BOARD</span></div>
    <div class="clock"><span id="phDate">--</span> | <span id="phTime">--:--:--</span></div>
  </header>

  <main class="board-main">
    <section class="panel main-panel">
      <div class="panel-header">CEMENT LOADING & BERTH STATUS <span id="syncText" class="live-status">LIVE</span></div>
      <div id="berthGrid" class="flight-table"></div>
    </section>

    <div class="bottom-split">
      <section class="panel">
        <div class="panel-header">ALPHA & FOREIGN BERTHS</div>
        <div id="alphaRows" class="flight-table alpha-table"></div>
      </section>
      
      <section class="panel side-panel">
        <div class="panel-header">PORT MANPOWER & PRODUCTION</div>
        <div class="stats-compact">
          <div>SUP: <b id="supervisor">--</b></div>
          <div>CHK: <b id="checker">--</b></div>
          <div>PMC: <b id="pmc">--</b></div>
          <div>CRANE: <b id="cranes">--</b></div>
          <div>FORK: <b id="forklifts">--</b></div>
          <div>STEVEDORE: <b id="stevedores">--</b></div>
          <div>1ST SHIFT: <b id="shift1">--</b></div>
          <div>STOCKPILE: <b id="stockTotal">--</b></div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="ticker-label">NOTICE</div>
    <div class="ticker"><div id="tickerText">LOADING FLIGHT-BOARD DATA...</div></div>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
